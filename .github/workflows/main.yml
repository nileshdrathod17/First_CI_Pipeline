name: First Pipeline
# on: workflow_dispatch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: mv node_modules dist/
      - run: cp package.json dist/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: webapp
          path: dist
  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: test-coverage
          path: coverage
  code_quality:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint

  docker_build_push:
    runs-on: ubuntu-22.04
    needs: code_quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nileshrathod17/firstpipeline:latest


# this deployment job will deploy the docker image to a KOPS-managed Kubernetes cluster. 
        

  deploy:
    name: Deploy To KOPS
    runs-on: ubuntu-22.04
    needs: docker_build_push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
        

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          cat <<EOF > $HOME/.kube/config
          ${{ secrets.KUBECONFIG }}
          EOF
          chmod 600 $HOME/.kube/config

      - name: Verify KOPS Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Application
        run: |
          kubectl apply -f ./deployment.yaml
          kubectl apply -f ./service.yaml

      - name: Update Image
        run: |
          kubectl set image deployment/firstpipeline \
          firstpipeline=nileshrathod17/firstpipeline

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/firstpipeline --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get deployment
          kubectl get pods -o wide
          kubectl get svc


          
      
      
          
